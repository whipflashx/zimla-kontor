# Zimla Kontor på servern (/opt/kontor). Zimlas egen image, byggd i GitHub Actions (.github/workflows/image.yml).
services:
  app:
    image: ghcr.io/whipflashx/zimla-kontor:${IMAGE_TAG:?IMAGE_TAG saknas i .env}
    # Standarden (1 GB) gav "JavaScript heap out of memory" vid första sidan (~512 MB heap). Servern har 8 GB.
    mem_limit: 3g
    environment:
      NODE_OPTIONS: --max-old-space-size=2048
